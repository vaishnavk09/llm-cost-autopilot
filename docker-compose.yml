services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped
