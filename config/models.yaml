# Shadow list prices are USD per 1M tokens (Groq / Gemini published rates).
# Ollama is self-hosted; we still assign a small compute-equivalent rate so routing has a cost signal.
models:
  - id: ollama-llama32-3b
    provider: ollama
    model_id: llama3.2:3b
    cost_per_input_token: 0.02
    cost_per_output_token: 0.02
    average_latency_ms: 1200
    quality_tier: low
    enabled: true

  - id: groq-llama-8b
